# App-side Rust, compiled into the Flutter app by rust_builder/ (cargokit).
# The crate name must stay `rust_lib_app` — rust_builder/ refers to it.
# Not a member of the ../Cargo.toml workspace: it targets phones, not wasm.
[package]
name = "rust_lib_app"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Must equal the `flutter_rust_bridge` version in pubspec.yaml and the
# installed `flutter_rust_bridge_codegen` version.
flutter_rust_bridge = "=2.13.0"
shared = { path = "../shared" }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
